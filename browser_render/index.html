<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIPS Minimalist Line Puppetry - Real-Time Browser Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0f12;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }
        #stage-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #15181e 0%, #090a0d 100%);
        }
        #overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }
        .badge-live {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
            font-weight: 700;
        }
        .badge-live::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }
        #click-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 29, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-group label {
            color: #94a3b8;
            font-weight: 500;
        }
        input[type="range"] {
            accent-color: #38bdf8;
            cursor: pointer;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        button.active {
            background: #10b981;
        }
        #btn-intervene {
            background: #b91c1c;
        }
        #btn-intervene:hover {
            background: #dc2626;
        }
        #subtitles {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            max-width: 75%;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #f8fafc;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body>
    <div id="stage-container">
        <canvas id="stage"></canvas>

        <div id="overlay-ui">
            <div class="badge badge-live">ALIPS PROCEDURAL KINEMATIC STAGE</div>
            <div class="badge" id="tension-badge">TENSION: 0.60 (STABLE)</div>
            <div class="badge" id="status-badge">STATUS SEE-SAW: A(8.0) ↔ B(2.3)</div>
            <div class="badge" id="fps-badge">FPS: 60</div>
            <div class="badge" id="walk-badge">LOCOMOTION: ACTIVE (2-BONE IK GAIT)</div>
        </div>

        <div id="click-hint">💡 Click anywhere on stage floor to make the active character walk there!</div>

        <div id="subtitles">"The estate belongs to the Duke, Thomas. Put down the silver."</div>

        <div id="controls-panel">
            <div class="control-group">
                <label>Dramatic Tension: <span id="val-tension">0.60</span></label>
                <input type="range" id="slider-tension" min="0" max="1" step="0.05" value="0.60">
            </div>
            <div class="control-group">
                <label>Agent A Status: <span id="val-status-a">8.0</span></label>
                <input type="range" id="slider-status-a" min="1" max="10" step="0.5" value="8.0">
            </div>
            <div class="control-group">
                <label>Line Wobble: <span id="val-wobble">1.5</span></label>
                <input type="range" id="slider-wobble" min="0" max="5" step="0.2" value="1.5">
            </div>
            <button id="btn-pacing" class="active">AUTO PACING: ON</button>
            <button id="btn-confront">CONFRONT</button>
            <button id="btn-intervene">FORUM STOP!</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------------------
        // ALIPS Minimalist Expressive Line Puppetry Engine
        // With Analytical 2-Bone Inverse Kinematics (IK) Procedural Walk Engine
        // ---------------------------------------------------------------------
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Analytical 2-Bone Inverse Kinematics Solver (Law of Cosines)
        function solve2BoneIK(hx, hy, fx, fy, L1, L2, bendDir = 1) {
            const dx = fx - hx;
            const dy = fy - hy;
            const d = Math.max(1, Math.min(Math.hypot(dx, dy), (L1 + L2) * 0.999));
            const baseAngle = Math.atan2(dy, dx);

            // Law of Cosines for interior knee angle
            const cosBeta = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
            const beta = Math.acos(Math.max(-1, Math.min(1, cosBeta)));

            // Knee coordinates
            const kneeAngle = baseAngle + (beta * bendDir);
            const kx = hx + Math.cos(kneeAngle) * L1;
            const ky = hy + Math.sin(kneeAngle) * L1;

            return { kx, ky, fx, fy };
        }

        // Global Parameters
        let dramaticTension = 0.60;
        let lineWobbleFactor = 1.5;
        let sceneHalted = false;
        let autoPacingEnabled = true;

        // Kinematic Character Entity
        class ExpressiveLineCharacter {
            constructor(name, baseColor, defaultX, groundY, statusLevel, facing = 1) {
                this.name = name;
                this.baseColor = baseColor;
                this.rootX = defaultX;
                this.targetX = defaultX;
                this.groundY = groundY;
                this.status = statusLevel; // 1.0 to 10.0
                this.facing = facing; // +1 facing right, -1 facing left
                this.isSpeaking = false;
                this.mouthOpen = 0.0;
                this.mouthSmile = 0.0;

                // Skeletal Dimensions
                this.spineLength = 105;
                this.shoulderWidth = 42;
                this.hipWidth = 30;
                this.upperArmLen = 48;
                this.foreArmLen = 42;
                this.upperLegLen = 62;
                this.lowerLegLen = 62;
                this.headRadius = 23;

                // Locomotion & Physics Memory
                this.vx = 0;
                this.walkPhase = 0; // Gait cycle accumulator
                this.pelvisY = groundY - 110;
                this.spineAngle = 0;
                this.headAngle = 0;
                this.isWalking = false;

                // Foot positions
                this.lFootX = defaultX - 15;
                this.lFootY = groundY;
                this.rFootX = defaultX + 15;
                this.rFootY = groundY;
            }

            update(time, tension, dt = 0.016) {
                const normStatus = (this.status - 1) / 9; // 0.0 (submissive) to 1.0 (dominant)

                // 1. Horizontal Locomotion & Pacing
                const distToTarget = this.targetX - this.rootX;
                const walkThreshold = 4;

                if (Math.abs(distToTarget) > walkThreshold && !sceneHalted) {
                    this.isWalking = true;
                    this.facing = distToTarget > 0 ? 1 : -1;
                    
                    // High status strides confidently; low status scurries or drags feet
                    const baseSpeed = (120 + (normStatus * 80) + (tension * 60));
                    const moveDir = Math.sign(distToTarget);
                    this.vx = moveDir * baseSpeed * dt;

                    // Clamp to target
                    if (Math.abs(distToTarget) < Math.abs(this.vx)) {
                        this.rootX = this.targetX;
                        this.vx = 0;
                        this.isWalking = false;
                    } else {
                        this.rootX += this.vx;
                    }

                    // Advance gait phase based on distance traveled
                    const strideLength = 32 + (normStatus * 20); // Long strides for high status
                    this.walkPhase += (Math.abs(this.vx) / strideLength) * Math.PI * 2;
                } else {
                    this.isWalking = false;
                    this.vx = 0;
                    // Gradually return walk phase to relaxed rest
                    this.walkPhase *= 0.92;
                }

                // 2. Procedural Breathing & Gait Bounce
                const breathFreq = 0.3 + (tension * 0.4);
                const breathAmp = 3 + (normStatus * 4);
                const breath = Math.sin(time * breathFreq * Math.PI * 2) * breathAmp;

                // Pelvic vertical bounce (inverted pendulum gait during walking)
                const walkBob = this.isWalking ? -Math.abs(Math.sin(this.walkPhase)) * 8 : 0;
                const postureHeightMod = (normStatus - 0.5) * 26;
                const targetPelvisY = (this.groundY - (this.upperLegLen + this.lowerLegLen - 12)) - postureHeightMod + breath * 0.3 + walkBob;
                this.pelvisY += (targetPelvisY - this.pelvisY) * 0.2;

                // 3. Dynamic Spine & Head Angles
                // Walking leans slightly forward; low status hunches
                const walkLean = this.isWalking ? (this.facing * 0.12) : 0;
                const targetSpineAngle = ((1.0 - normStatus) * 0.25) + walkLean;
                this.spineAngle += (targetSpineAngle - this.spineAngle) * 0.1;

                const targetHeadAngle = (normStatus - 0.7) * 0.2;
                this.headAngle += (targetHeadAngle - this.headAngle) * 0.1;

                // 4. Foot Trajectory Kinematics (Gait Cycle)
                const strideLen = 30 + (normStatus * 18);
                const stepHeight = 16 + (tension * 8);

                const lHipX = this.rootX - (this.hipWidth * 0.5);
                const rHipX = this.rootX + (this.hipWidth * 0.5);

                if (this.isWalking) {
                    // Left Leg Phase
                    const phiL = this.walkPhase;
                    const sinL = Math.sin(phiL);
                    const cosL = Math.cos(phiL);

                    this.lFootX = lHipX + (cosL * strideLen * this.facing);
                    // Lift off ground during swing phase (sin > 0)
                    this.lFootY = (sinL > 0) ? this.groundY - (sinL * stepHeight) : this.groundY;

                    // Right Leg Phase (Anti-phase, 180 deg shifted)
                    const phiR = this.walkPhase + Math.PI;
                    const sinR = Math.sin(phiR);
                    const cosR = Math.cos(phiR);

                    this.rFootX = rHipX + (cosR * strideLen * this.facing);
                    this.rFootY = (sinR > 0) ? this.groundY - (sinR * stepHeight) : this.groundY;
                } else {
                    // Resting stance width governed by status
                    const restStance = 16 + (normStatus * 18);
                    const targetLFootX = lHipX - (restStance * 0.5);
                    const targetRFootX = rHipX + (restStance * 0.5);

                    this.lFootX += (targetLFootX - this.lFootX) * 0.2;
                    this.rFootX += (targetRFootX - this.rFootX) * 0.2;
                    this.lFootY += (this.groundY - this.lFootY) * 0.2;
                    this.rFootY += (this.groundY - this.rFootY) * 0.2;
                }

                // 5. Speech Viseme Oscillation
                if (this.isSpeaking) {
                    this.mouthOpen = Math.abs(Math.sin(time * 14)) * 0.85;
                } else {
                    this.mouthOpen *= 0.85;
                }
            }

            draw(ctx, time, wobbleFactor, tension) {
                ctx.save();

                const normStatus = (this.status - 1) / 9;
                const baseLineWidth = 2.0 + (normStatus * 2.5);
                ctx.lineWidth = baseLineWidth;
                ctx.strokeStyle = this.baseColor;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const jitter = (mag = 1.0) => {
                    const w = wobbleFactor * (1.0 + tension * 1.5) * mag;
                    return (Math.random() - 0.5) * w;
                };

                const px = this.rootX + jitter(0.5);
                const py = this.pelvisY + jitter(0.5);

                // 1. Spine & Neck Vector
                const neckX = px + Math.sin(this.spineAngle) * this.spineLength + jitter(0.7);
                const neckY = py - Math.cos(this.spineAngle) * this.spineLength + jitter(0.7);

                ctx.beginPath();
                ctx.moveTo(px, py);
                const ctrlX = px + Math.sin(this.spineAngle * 0.5) * (this.spineLength * 0.5) + jitter(1);
                const ctrlY = (py + neckY) * 0.5 + jitter(1);
                ctx.quadraticCurveTo(ctrlX, ctrlY, neckX, neckY);
                ctx.stroke();

                // 2. Head & Facial Features
                const headCenterX = neckX + Math.sin(this.headAngle) * this.headRadius + jitter(0.5);
                const headCenterY = neckY - Math.cos(this.headAngle) * this.headRadius + jitter(0.5);

                ctx.beginPath();
                ctx.arc(headCenterX, headCenterY, this.headRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Eyes
                const eyeSpread = 7;
                const eyeYOffset = -2;
                ctx.fillStyle = this.baseColor;
                ctx.beginPath();
                ctx.arc(headCenterX + (eyeSpread * this.facing * 0.7), headCenterY + eyeYOffset, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                const mouthY = headCenterY + 9;
                const mouthX = headCenterX + (this.facing * 6);
                const openDist = this.mouthOpen * 7;

                ctx.beginPath();
                if (openDist > 1.0) {
                    ctx.ellipse(mouthX, mouthY, 4, openDist, 0, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.moveTo(mouthX - 4, mouthY);
                    ctx.quadraticCurveTo(mouthX, mouthY + (this.mouthSmile * 4), mouthX + 4, mouthY);
                    ctx.stroke();
                }

                // 3. Shoulders & Arms (With Biological Counter-Swing Locomotion)
                const shoulderY = neckY + 12;
                const lShoulderX = neckX - (this.shoulderWidth * 0.5);
                const rShoulderX = neckX + (this.shoulderWidth * 0.5);

                ctx.beginPath();
                ctx.moveTo(lShoulderX, shoulderY);
                ctx.lineTo(rShoulderX, shoulderY);
                ctx.stroke();

                // Walking arm counter-swing
                const armSwing = this.isWalking ? Math.sin(this.walkPhase) * 26 * this.facing : 0;
                const gestureAmp = this.isSpeaking ? Math.sin(time * 6) * 18 : 0;

                // Left Arm (Swings with Right Leg)
                const lHandX = lShoulderX - (armSwing * 0.9) - 15;
                const lHandY = shoulderY + 45 + Math.abs(armSwing * 0.4);
                ctx.beginPath();
                ctx.moveTo(lShoulderX, shoulderY);
                ctx.lineTo(lShoulderX - 10, shoulderY + 25);
                ctx.lineTo(lHandX, lHandY);
                ctx.stroke();

                // Right Arm (Swings with Left Leg + Speaking Gestures)
                const rHandX = rShoulderX + (armSwing * 0.9) + (this.facing * 20) + gestureAmp;
                const rHandY = shoulderY + 35 - gestureAmp - Math.abs(armSwing * 0.3);
                ctx.beginPath();
                ctx.moveTo(rShoulderX, shoulderY);
                ctx.lineTo(rShoulderX + (this.facing * 12), shoulderY + 22);
                ctx.lineTo(rHandX, rHandY);
                ctx.stroke();

                // 4. Pelvis & 2-Bone Inverse Kinematic Legs
                const lHipX = px - (this.hipWidth * 0.5);
                const rHipX = px + (this.hipWidth * 0.5);

                // Solve Left Leg IK
                const lIK = solve2BoneIK(lHipX, py, this.lFootX, this.lFootY, this.upperLegLen, this.lowerLegLen, this.facing);
                ctx.beginPath();
                ctx.moveTo(lHipX, py);
                ctx.lineTo(lIK.kx, lIK.ky); // Knee joint
                ctx.lineTo(lIK.fx, lIK.fy); // Foot contact
                ctx.lineTo(lIK.fx + (this.facing * 8), lIK.fy); // Foot toe
                ctx.stroke();

                // Solve Right Leg IK
                const rIK = solve2BoneIK(rHipX, py, this.rFootX, this.rFootY, this.upperLegLen, this.lowerLegLen, this.facing);
                ctx.beginPath();
                ctx.moveTo(rHipX, py);
                ctx.lineTo(rIK.kx, rIK.ky); // Knee joint
                ctx.lineTo(rIK.fx, rIK.fy); // Foot contact
                ctx.lineTo(rIK.fx + (this.facing * 8), rIK.fy); // Foot toe
                ctx.stroke();

                // Character Name Tag
                ctx.font = '11px -apple-system, sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.textAlign = 'center';
                const walkStateText = this.isWalking ? ' 🚶' : '';
                ctx.fillText(`${this.name} [S:${this.status.toFixed(1)}]${walkStateText}`, px, this.groundY + 25);

                ctx.restore();
            }
        }

        // Initialize Dramaturgical Entities
        const groundLevel = window.innerHeight * 0.72;
        const agentA = new ExpressiveLineCharacter("AGENT_A", "#38bdf8", window.innerWidth * 0.28, groundLevel, 8.0, 1);
        const agentB = new ExpressiveLineCharacter("AGENT_B", "#fb923c", window.innerWidth * 0.72, groundLevel, 2.3, -1);
        agentA.isSpeaking = true;

        // Autonomous Theatrical Pacing Controller
        let lastPacingDecisionTime = 0;
        function updateAutonomousStagePacing(time) {
            if (!autoPacingEnabled || sceneHalted) return;

            // Make a theatrical movement decision every 4-6 seconds
            if (time - lastPacingDecisionTime > 4.5) {
                lastPacingDecisionTime = time;

                const centerStage = window.innerWidth * 0.5;
                const stageLeft = window.innerWidth * 0.22;
                const stageRight = window.innerWidth * 0.78;

                // Dominant character (Status >= 7) steps forward to confront or patrol
                if (agentA.status >= 7.0) {
                    if (agentA.isSpeaking) {
                        // Strides forward into center stage
                        agentA.targetX = centerStage - 80 + (Math.random() * 60);
                    } else {
                        // Returns to commanding posture
                        agentA.targetX = stageLeft + (Math.random() * 70);
                    }
                }

                // Submissive or agitated character retreats or paces nervously
                if (agentB.status < 5.0) {
                    if (agentB.isSpeaking) {
                        // Anxious pacing: steps toward center, then retreats
                        agentB.targetX = centerStage + 110 + (Math.random() * 80);
                    } else {
                        // Backs away toward stage right border
                        agentB.targetX = stageRight - (Math.random() * 60);
                    }
                } else {
                    // Status Clash: Both step into tight confrontation zone!
                    agentB.targetX = centerStage + 60;
                    agentA.targetX = centerStage - 60;
                }
            }
        }

        // Render Loop
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function animate(timestamp) {
            const dt = Math.min(0.05, (timestamp - lastFrameTime) * 0.001);
            lastFrameTime = timestamp;
            const time = timestamp * 0.001;

            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                document.getElementById('fps-badge').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastFpsUpdate = timestamp;
            }

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stage Horizon Floor
            ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(window.innerWidth, groundLevel);
            ctx.stroke();

            // Alternate speaking turn every 5 seconds for natural improv
            if (!sceneHalted) {
                const turnCycle = Math.floor(time / 5) % 2;
                agentA.isSpeaking = (turnCycle === 0);
                agentB.isSpeaking = (turnCycle === 1);

                if (agentA.isSpeaking) {
                    document.getElementById('subtitles').textContent = '"The estate belongs to the Duke, Thomas. Put down the silver."';
                } else {
                    document.getElementById('subtitles').textContent = '"The Duke will not be dining tonight, sir. Look at your boots."';
                }

                updateAutonomousStagePacing(time);
                agentA.update(time, dramaticTension, dt);
                agentB.update(time, dramaticTension, dt);
            }

            // Render Both Characters
            agentA.draw(ctx, time, lineWobbleFactor, dramaticTension);
            agentB.draw(ctx, time, lineWobbleFactor, dramaticTension);

            // Forum Theatre Freeze Staging Overlay
            if (sceneHalted) {
                ctx.fillStyle = "rgba(239, 68, 68, 0.06)";
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                ctx.strokeStyle = "rgba(239, 68, 68, 0.8)";
                ctx.lineWidth = 2;
                ctx.strokeRect(40, 40, window.innerWidth - 80, window.innerHeight - 80);

                ctx.font = "bold 28px -apple-system, sans-serif";
                ctx.fillStyle = "#ef4444";
                ctx.textAlign = "center";
                ctx.fillText("⚡ FORUM THEATRE: SPECT-ACTOR INTERVENTION (SCENE HALTED) ⚡", window.innerWidth * 0.5, 90);
                ctx.font = "14px -apple-system, sans-serif";
                ctx.fillStyle = "#cbd5e1";
                ctx.fillText("Pre-crisis snapshot preserved. Locomotion and speech paused for audience substitution.", window.innerWidth * 0.5, 118);
            }

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // Click on Stage Horizon to Command Character Walking
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            
            // Move whichever character is currently speaking or closer
            const distA = Math.abs(clickX - agentA.rootX);
            const distB = Math.abs(clickX - agentB.rootX);

            if (agentA.isSpeaking || distA < distB) {
                agentA.targetX = Math.max(50, Math.min(window.innerWidth - 50, clickX));
            } else {
                agentB.targetX = Math.max(50, Math.min(window.innerWidth - 50, clickX));
            }
        });

        // UI Event Listeners
        const sliderTension = document.getElementById('slider-tension');
        sliderTension.addEventListener('input', (e) => {
            dramaticTension = parseFloat(e.target.value);
            document.getElementById('val-tension').textContent = dramaticTension.toFixed(2);
            document.getElementById('tension-badge').textContent = `TENSION: ${dramaticTension.toFixed(2)} (${dramaticTension > 0.7 ? 'HIGH' : 'NORMAL'})`;
        });

        const sliderStatusA = document.getElementById('slider-status-a');
        sliderStatusA.addEventListener('input', (e) => {
            agentA.status = parseFloat(e.target.value);
            agentB.status = Math.max(1.0, 10.0 - agentA.status * 0.8);
            document.getElementById('val-status-a').textContent = agentA.status.toFixed(1);
            document.getElementById('status-badge').textContent = `STATUS SEE-SAW: A(${agentA.status.toFixed(1)}) ↔ B(${agentB.status.toFixed(1)})`;
        });

        const sliderWobble = document.getElementById('slider-wobble');
        sliderWobble.addEventListener('input', (e) => {
            lineWobbleFactor = parseFloat(e.target.value);
            document.getElementById('val-wobble').textContent = lineWobbleFactor.toFixed(1);
        });

        const btnPacing = document.getElementById('btn-pacing');
        btnPacing.addEventListener('click', () => {
            autoPacingEnabled = !autoPacingEnabled;
            btnPacing.textContent = autoPacingEnabled ? "AUTO PACING: ON" : "AUTO PACING: OFF";
            btnPacing.classList.toggle('active', autoPacingEnabled);
        });

        const btnConfront = document.getElementById('btn-confront');
        btnConfront.addEventListener('click', () => {
            const center = window.innerWidth * 0.5;
            agentA.targetX = center - 60;
            agentB.targetX = center + 60;
            agentA.status = 9.0;
            agentB.status = 7.5; // Trigger intense status clash!
        });

        const btnIntervene = document.getElementById('btn-intervene');
        btnIntervene.addEventListener('click', () => {
            sceneHalted = !sceneHalted;
            btnIntervene.textContent = sceneHalted ? "RESUME SCENE" : "FORUM STOP!";
            btnIntervene.style.background = sceneHalted ? "#ef4444" : "#b91c1c";
        });

        // ---------------------------------------------------------------------
        // Native EventSource (SSE) Telemetry Listener from ALIPS Python Backend
        // ---------------------------------------------------------------------
        function connectTelemetry() {
            const evtSource = new EventSource('/stream');
            evtSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.tension !== undefined) {
                        dramaticTension = data.tension;
                        sliderTension.value = dramaticTension;
                        document.getElementById('val-tension').textContent = dramaticTension.toFixed(2);
                        document.getElementById('tension-badge').textContent = `TENSION: ${dramaticTension.toFixed(2)} (${dramaticTension > 0.7 ? 'HIGH' : 'NORMAL'})`;
                    }
                    if (data.status_a !== undefined) {
                        agentA.status = data.status_a;
                        agentB.status = data.status_b;
                        sliderStatusA.value = agentA.status;
                        document.getElementById('val-status-a').textContent = agentA.status.toFixed(1);
                        document.getElementById('status-badge').textContent = `STATUS SEE-SAW: A(${agentA.status.toFixed(1)}) ↔ B(${agentB.status.toFixed(1)})`;
                    }
                    if (data.subtitles) document.getElementById('subtitles').textContent = data.subtitles;
                    if (data.current_speaker) {
                        agentA.isSpeaking = (data.current_speaker === "AGENT_A");
                        agentB.isSpeaking = (data.current_speaker === "AGENT_B");
                    }
                } catch (err) {
                    console.error("Telemetry parse error", err);
                }
            };
            evtSource.onerror = () => {
                console.log("SSE reconnecting...");
            };
        }
        connectTelemetry();
    </script>
</body>
</html>
